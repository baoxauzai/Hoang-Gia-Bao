<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11"/>
      <stop offset="50%" stop-color="#140a20"/>
      <stop offset="100%" stop-color="#09131d"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="neonFire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff9900"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="1200" height="450" fill="url(#bgGrad1)"/>
  
  <!-- Cyber grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="250" x2="1200" y2="250"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="800" y1="0" x2="800" y2="450"/>
    <line x1="1000" y1="0" x2="1000" y2="450"/>
  </g>
  
  <!-- Background Glow Orbs -->
  <circle cx="1000" cy="225" r="180" fill="#ff0055" opacity="0.25" filter="url(#glow)"/>
  <circle cx="850" cy="180" r="140" fill="#00f0ff" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Graphic: Keyboard & Mouse Silhouette with Neon Accents -->
  <g transform="translate(720, 110)">
    <!-- Keyboard body -->
    <rect x="0" y="50" width="380" height="150" rx="14" fill="#161b26" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Keys rows with RGB colors -->
    <g fill="#212a3d">
      <rect x="15" y="65" width="22" height="20" rx="4" fill="#00f0ff" opacity="0.8"/>
      <rect x="42" y="65" width="20" height="20" rx="4"/>
      <rect x="67" y="65" width="20" height="20" rx="4"/>
      <rect x="92" y="65" width="20" height="20" rx="4"/>
      <rect x="117" y="65" width="20" height="20" rx="4"/>
      <rect x="142" y="65" width="20" height="20" rx="4"/>
      <rect x="167" y="65" width="20" height="20" rx="4"/>
      <rect x="192" y="65" width="20" height="20" rx="4"/>
      <rect x="217" y="65" width="20" height="20" rx="4"/>
      <rect x="242" y="65" width="20" height="20" rx="4"/>
      <rect x="267" y="65" width="20" height="20" rx="4"/>
      <rect x="292" y="65" width="20" height="20" rx="4"/>
      <rect x="317" y="65" width="45" height="20" rx="4" fill="#ff0055" opacity="0.8"/>
      
      <!-- Row 2 -->
      <rect x="15" y="92" width="32" height="20" rx="4"/>
      <rect x="52" y="92" width="20" height="20" rx="4"/>
      <rect x="77" y="92" width="20" height="20" rx="4" fill="#00ffcc" opacity="0.7"/>
      <rect x="102" y="92" width="20" height="20" rx="4" fill="#00ffcc" opacity="0.7"/>
      <rect x="127" y="92" width="20" height="20" rx="4" fill="#00ffcc" opacity="0.7"/>
      <rect x="152" y="92" width="20" height="20" rx="4"/>
      <rect x="177" y="92" width="20" height="20" rx="4"/>
      <rect x="202" y="92" width="20" height="20" rx="4"/>
      <rect x="227" y="92" width="20" height="20" rx="4"/>
      <rect x="252" y="92" width="20" height="20" rx="4"/>
      <rect x="277" y="92" width="20" height="20" rx="4"/>
      <rect x="302" y="92" width="60" height="20" rx="4"/>

      <!-- Spacebar row -->
      <rect x="15" y="146" width="38" height="22" rx="4"/>
      <rect x="58" y="146" width="30" height="22" rx="4"/>
      <rect x="93" y="146" width="30" height="22" rx="4"/>
      <rect x="128" y="146" width="135" height="22" rx="4" fill="#7000ff" opacity="0.8"/>
      <rect x="268" y="146" width="28" height="22" rx="4"/>
      <rect x="301" y="146" width="28" height="22" rx="4"/>
      <rect x="334" y="146" width="28" height="22" rx="4" fill="#00f0ff" opacity="0.8"/>
    </g>
    
    <!-- Gaming Mouse -->
    <g transform="translate(290, 80)">
      <path d="M40,0 C65,0 80,30 80,75 C80,120 65,145 40,145 C15,145 0,120 0,75 C0,30 15,0 40,0 Z" fill="#182030" stroke="#ff0055" stroke-width="2.5" filter="url(#glow)"/>
      <line x1="40" y1="0" x2="40" y2="55" stroke="#ff0055" stroke-width="1.5"/>
      <rect x="36" y="25" width="8" height="22" rx="3" fill="#00f0ff" filter="url(#glow)"/>
      <!-- Mouse RGB strip -->
      <path d="M15,95 Q40,125 65,95" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>
    </g>
  </g>
  
  <!-- Text Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#ff0055" opacity="0.2"/>
    <text x="15" y="23" font-family="'Orbitron', sans-serif" font-weight="700" font-size="14" fill="#ff0055" letter-spacing="2">
      ⚡ SIÊU SALE GAMING
    </text>
    
    <text x="0" y="85" font-family="'Orbitron', sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="1">
      GMAK FLASH SALE
    </text>
    <text x="0" y="140" font-family="'Orbitron', sans-serif" font-weight="900" font-size="52" fill="url(#neonFire)" letter-spacing="1">
      GIẢM ĐẾN 50%
    </text>
    
    <text x="0" y="185" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#a0aec0">
      Nâng cấp setup gaming chuyên nghiệp: Phím cơ Custom, Chuột siêu nhẹ PAW3395
    </text>
    
    <!-- CTA Button Simulation in SVG -->
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="8" fill="url(#neonCyan)" filter="url(#glow)"/>
      <text x="35" y="33" font-family="'Orbitron', sans-serif" font-weight="800" font-size="16" fill="#0b0e14" letter-spacing="1">
        SĂN SALE NGAY →
      </text>
    </g>
  </g>
</svg>
