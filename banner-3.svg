<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#190d2e"/>
      <stop offset="100%" stop-color="#0e1326"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="450" fill="url(#bgGrad3)"/>
  <circle cx="850" cy="225" r="210" fill="#bf00ff" opacity="0.2" filter="url(#glow3)"/>
  
  <!-- Mouse Illustration -->
  <g transform="translate(800, 100)">
    <!-- Aura -->
    <ellipse cx="60" cy="120" rx="90" ry="140" fill="#ff007f" opacity="0.1" filter="url(#glow3)"/>
    <!-- Mouse shell -->
    <path d="M60,10 C100,10 125,50 125,120 C125,190 100,230 60,230 C20,230 -5,190 -5,120 C-5,50 20,10 60,10 Z" fill="#151528" stroke="#ff007f" stroke-width="3" filter="url(#glow3)"/>
    <!-- Main buttons split -->
    <line x1="60" y1="10" x2="60" y2="90" stroke="#bf00ff" stroke-width="2"/>
    <path d="M20,90 Q60,95 100,90" fill="none" stroke="#252542" stroke-width="2"/>
    <!-- Scroll wheel -->
    <rect x="54" y="40" width="12" height="32" rx="5" fill="#00f0ff" filter="url(#glow3)"/>
    <line x1="60" y1="46" x2="60" y2="66" stroke="#0e1326" stroke-width="2"/>
    <!-- GMAK Logo Badge on mouse palm -->
    <polygon points="50,165 70,165 60,185" fill="#bf00ff" filter="url(#glow3)"/>
    <!-- Weight badge floating -->
    <g transform="translate(140, 40)">
      <rect x="0" y="0" width="100" height="42" rx="21" fill="#1c1633" stroke="#00f0ff" stroke-width="1.5"/>
      <text x="18" y="27" font-family="'Orbitron', sans-serif" font-weight="900" font-size="16" fill="#00f0ff">
        CHỈ 49G
      </text>
    </g>
    <!-- Sensor badge floating -->
    <g transform="translate(-100, 150)">
      <rect x="0" y="0" width="140" height="42" rx="21" fill="#1c1633" stroke="#ff007f" stroke-width="1.5"/>
      <text x="14" y="26" font-family="'Orbitron', sans-serif" font-weight="800" font-size="13" fill="#ff007f">
        PAW3395 • 26K
      </text>
    </g>
  </g>
  
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="175" height="34" rx="17" fill="#bf00ff" opacity="0.2"/>
    <text x="15" y="23" font-family="'Orbitron', sans-serif" font-weight="700" font-size="14" fill="#bf00ff" letter-spacing="2">
      🔥 SIÊU CHUỘT ESPORT
    </text>
    <text x="0" y="85" font-family="'Orbitron', sans-serif" font-weight="900" font-size="50" fill="#ffffff">
      GMAK G4PRO WIRELESS
    </text>
    <text x="0" y="135" font-family="'Orbitron', sans-serif" font-weight="800" font-size="34" fill="url(#purplePink)">
      TRỌNG LƯỢNG SIÊU NHẸ 49G
    </text>
    <text x="0" y="180" font-family="'Inter', sans-serif" font-weight="400" font-size="18" fill="#94a3b8">
      Mắt đọc Flagship PAW3395 26.000 DPI, Polling Rate 4000Hz, Huano Blue Pink Dot 80M
    </text>
    
    <g transform="translate(0, 220)">
      <rect x="0" y="0" width="220" height="52" rx="8" fill="url(#purplePink)" filter="url(#glow3)"/>
      <text x="35" y="33" font-family="'Orbitron', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="1">
        MUA NGAY - 1.250K →
      </text>
    </g>
  </g>
</svg>
