<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="500" height="350">
    <defs>
      <linearGradient id="gc" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#00f0ff"/>
        <stop offset="100%" stop-color="#ff0055"/>
      </linearGradient>
      <filter id="glowc">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <rect width="500" height="350" rx="16" fill="#0d111a"/>
    <circle cx="250" cy="160" r="120" fill="#00f0ff" opacity="0.15" filter="url(#glowc)"/>
    
    <!-- Mini Keyboard -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="280" height="150" rx="10" fill="#141a26" stroke="#00f0ff" stroke-width="2"/>
      <rect x="10" y="10" width="260" height="130" rx="6" fill="#090d14"/>
      <g fill="#212a3d">
        <rect x="18" y="18" width="18" height="14" rx="2" fill="#00f0ff"/>
        <rect x="40" y="18" width="16" height="14" rx="2"/>
        <rect x="60" y="18" width="16" height="14" rx="2"/>
        <rect x="80" y="18" width="16" height="14" rx="2"/>
        <rect x="100" y="18" width="16" height="14" rx="2"/>
        <rect x="120" y="18" width="16" height="14" rx="2"/>
        <rect x="140" y="18" width="16" height="14" rx="2"/>
        <rect x="160" y="18" width="16" height="14" rx="2"/>
        <rect x="180" y="18" width="16" height="14" rx="2"/>
        <rect x="200" y="18" width="16" height="14" rx="2"/>
        <rect x="220" y="18" width="16" height="14" rx="2"/>
        <rect x="240" y="18" width="20" height="14" rx="2" fill="#ff0055"/>

        <rect x="18" y="100" width="28" height="18" rx="2"/>
        <rect x="52" y="100" width="20" height="18" rx="2"/>
        <rect x="78" y="100" width="105" height="18" rx="3" fill="#00f0ff" opacity="0.8"/>
        <rect x="189" y="100" width="20" height="18" rx="2"/>
        <rect x="215" y="100" width="20" height="18" rx="2"/>
        <rect x="240" y="100" width="20" height="18" rx="2" fill="#ff0055"/>
      </g>
    </g>

    <!-- Mini Mouse next to it -->
    <g transform="translate(340, 85)">
      <path d="M45,0 C75,0 90,30 90,80 C90,135 75,150 45,150 C15,150 0,135 0,80 C0,30 15,0 45,0 Z" 
            fill="#151b26" stroke="#ff0055" stroke-width="2" filter="url(#glowc)"/>
      <line x1="45" y1="0" x2="45" y2="55" stroke="#ff0055" stroke-width="1.5"/>
      <rect x="40" y="20" width="10" height="22" rx="4" fill="#00f0ff"/>
      <path d="M20,110 Q45,135 70,110" fill="none" stroke="#ff0055" stroke-width="2"/>
    </g>

    <text x="250" y="305" font-family="'Orbitron', sans-serif" font-weight="700" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      COMBO GMAK CYBER STARTER
    </text>
    <text x="250" y="325" font-family="'Rajdhani', sans-serif" font-weight="600" font-size="12" fill="#00f0ff" text-anchor="middle" letter-spacing="3">
      GMAK COMBO GAMING GEAR
    </text>
  </svg>