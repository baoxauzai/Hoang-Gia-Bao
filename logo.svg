<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" width="360" height="72">
  <defs>
    <linearGradient id="gmakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Icon mark (hexagon cyber) -->
  <polygon points="8,12 34,12 47,36 34,60 8,60 21,36"
    fill="url(#gmakGrad)" filter="url(#neonGlow)"/>
  <polygon points="17,22 29,22 36,36 29,50 17,50 24,36"
    fill="#0b0e14"/>
  <circle cx="27" cy="36" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>

  <!-- GMAK text -->
  <text x="58" y="50"
    font-family="'Orbitron','Segoe UI',sans-serif"
    font-weight="900"
    font-size="30"
    letter-spacing="3"
    fill="#ffffff">GMAK</text>

  <!-- Separator bar -->
  <rect x="166" y="20" width="2" height="32" rx="1" fill="#00f0ff" opacity="0.5"/>

  <!-- GEAR text with neon gradient -->
  <text x="178" y="50"
    font-family="'Orbitron','Segoe UI',sans-serif"
    font-weight="900"
    font-size="30"
    letter-spacing="3"
    fill="url(#gearGrad)"
    filter="url(#neonGlow)">GEAR</text>

  <!-- Tagline -->
  <text x="58" y="66"
    font-family="'Rajdhani','Segoe UI',sans-serif"
    font-weight="600"
    font-size="10"
    letter-spacing="5"
    fill="#00f0ff">GAMING KEYBOARDS &amp; MICE</text>
</svg>
